<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus IDS Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Campus IDS</h2>
        <ul>
            <li id="nav-dashboard" class="active"><a href="index.html">Live Dashboard</a></li>
            <li id="nav-hostory"><a href="history.html">History</a></li>
            <li id="nav-notification"><a href="notification.html">Notification</a></li>
        </ul>
    </div>
    
    <div class="main-content">
        <header>
            <h1>Campus IDS Dashboard</h1>
            <div class="system-status">
                Status: <span id="status-indicator" class="status online">Active</span>
            </div>
        </header>

        <section class="cards-grid">
            <div class="card">
                <h3>Total Alerts</h3>
                <p id="total-alerts" class="stat-number">0</p>
            </div>
            <div class="card warning">
                <h3>High Confidence Threats</h3>
                <p id="high-alerts" class="stat-number">0</p>
            </div>
            <div class="card info">
                <h3>Signature Matches</h3>
                <p id="sig-threats" class="stat-number">0</p>
            </div>
            <div class="card success">
                <h3>Anomaly Detections</h3>
                <p id="anomaly-threats" class="stat-number">0</p>
            </div>
        </section>

        <section class="chart-and-actions">
            <div class="chart-container">
                <h3>Threat Distribution</h3>
                <canvas id="threatChart"></canvas>
            </div>
        </section>

        <section class="table-container">
            <h3>Real-Time Alert Feed</h3>
            <table id="alerts-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Type</th>
                        <th>Source IP</th>
                        <th>Src Port</th>
                        <th>Dest IP</th>
                        <th>Dest Port</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody id="alerts-body">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
