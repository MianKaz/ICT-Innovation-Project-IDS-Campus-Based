<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert History</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="sidebar">
        <h2>Campus IDS</h2>
        <ul>
            <li id="nav-dashboard"><a href="index.html">Live Dashboard</a></li>
            <li id="nav-traffic"><a href="traffic.html">Live Traffic</a></li>
            <li id="nav-history" class="active"><a href="history.html">History</a></li>
            <li id="nav-notification"><a href="notification.html">Notification</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Historical Threat Logs</h1>
            <div class="system-status">
                Status: <span id="status-indicator" class="status online">Active</span>
            </div>
        </header>

        <section class="actions-container" style="margin-bottom: 2rem;">
            <h3>Log Export Controls</h3>
            <div style="display: flex; gap: 1rem;">
                <button id="export-json-btn" class="btn">Export Logs (JSON)</button>
                <button id="export-csv-btn" class="btn secondary">Export Logs (CSV)</button>
                <!--<button id="clear-history-btn" class="btn danger">Clear All Alerts &amp; History</button>-->
            </div>
        </section>

        <section class="table-container">
            <h3>All Historical Alert Logs</h3>
            <nav class="history-pagination" aria-label="Alert history pages">
                <button id="history-refresh" class="btn" type="button">Refresh logs</button>
                <span id="history-new-alert-count" class="history-new-alert-count" aria-live="polite">
                    New alerts since refresh: 0
                </span>
                <button id="history-previous-page" class="btn secondary" type="button">Previous</button>
                <button id="history-next-page" class="btn secondary" type="button">Next</button>
                <label for="history-page-input">Page</label>
                <input id="history-page-input" type="number" min="1" value="1" aria-label="Page number">
                <button id="history-go-to-page" class="btn secondary" type="button">Go</button>
                <button id="history-last-page" class="btn secondary" type="button">Last page</button>
                <span id="history-page-info" aria-live="polite">Page 1 of 1 (0 alerts)</span>
            </nav>
            <table id="history-alerts-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Type</th>
                        <th>Source IP</th>
                        <th>Src Port</th>
                        <th>Dest IP</th>
                        <th>Dest Port</th>
                        <th>Confidence</th>
                    </tr>
                </thead>
                <tbody id="history-alerts-body">
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
